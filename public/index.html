<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Notion 캘린더</title>
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <button class="avatar" id="btnToday" aria-label="오늘로 이동">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7"/><path d="M6 34c2-8 8-11 14-11s12 3 14 11z"/></svg>
      </button>
      <button class="month-title" id="btnMonth" aria-label="월 선택">
        <span id="monthLabel"></span><svg viewBox="0 0 12 8" class="caret"><path d="M1 1l5 5 5-5z"/></svg>
      </button>
      <span class="badge" id="demoBadge" hidden>데모</span>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnSearch" aria-label="검색">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg>
      </button>
      <button class="icon-btn" id="btnRefresh" aria-label="새로고침">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      </button>
    </header>

    <div class="weekdays">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>

    <main id="grid" class="grid" aria-live="polite"></main>
    <div class="loading" id="loading" hidden></div>
    <button class="fab" id="btnAdd" aria-label="일정 추가">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div id="sheetBody"></div>
  </section>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
